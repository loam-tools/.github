name: Bug report
description: Report a reproducible problem in a Loam Tools project
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a reproducible problem. Do not include secrets, signing material or private location history.
  - type: input
    id: version
    attributes:
      label: Version
      description: App, router or release version where the problem occurs.
      placeholder: v0.3.2.alpha
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the exact error or incorrect behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps that reliably reproduce the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Press ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: routing
    attributes:
      label: Routing context
      description: For routing bugs, include safe-to-share origin/destination, profile, online/offline state and routing-data version. Leave blank otherwise.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Device/OS, network state, and anything else relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked for an existing issue describing the same problem.
          required: true
        - label: I removed secrets, credentials and unnecessary private location data.
          required: true
