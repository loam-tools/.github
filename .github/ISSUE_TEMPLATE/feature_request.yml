name: Feature request
description: Propose a focused product or engineering improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What current limitation or workflow should improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful solution.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Routing
        - Offline data
        - Maps
        - Ride mode
        - Gear
        - Safety
        - Updates / release infrastructure
        - Developer tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints / tradeoffs
      description: Mention offline behavior, performance, storage, battery, compatibility or data/licensing constraints when relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked for an existing issue covering the same proposal.
          required: true
